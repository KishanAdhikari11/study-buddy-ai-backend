name: study-buddy-ai

services:
  backend:
    image: ghcr.io/kishanadhikari11/study-buddy-ai-backend:latest
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      POSTGRES_URL: ${DB_URL}
      REDIS_URL: redis://redis:6379

  db:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: study-buddy-ai
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    restart: always
    volumes:
      - redis-data:/data

volumes:
  pg_data:
  redis-data: