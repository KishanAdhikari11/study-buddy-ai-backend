name: Build & Push Backend Image

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/kishanadhikari11/study-buddy-ai-backend:latest .

      - name: Push image
        run: docker push ghcr.io/kishanadhikari11/study-buddy-ai-backend:latest